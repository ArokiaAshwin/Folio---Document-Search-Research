services:
  - type: web
    name: folio-doc-search
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: DEFAULT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    disk:
      name: folio-data
      mountPath: /app/backend/chroma_db
      sizeGB: 1
